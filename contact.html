<DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<title>ContactUs</title>
	<style type="text/css">
		#header{
			text-align: center;
			color: blue;
			font-size: 50px;
			text-transform: uppercase;
		}

		.form-shape{
			font-size: 20px;
			margin: 10px;
			margin-bottom: 20px;

		}
		.form-shape label{
			display: block;
			margin-bottom: 15px;
		}

		.form-shape input, .form-shape select {
			width: 90%;
			border-radius: 2px;
			padding: 10px;
			background-color:whitesmoke;

		}
		#message{
			width: 90%;
			background-color: whitesmoke;
		}
		#radio{
			font-size:20px;
			margin: 10px;
			display: inline-block;
		}

		.btn{
			margin: 10px;
			background-color: black;
			color:blue;
			padding: 18px;
			width: 90%;
			border-radius: 2px;
			border: 1px solid black;
			margin-top: 50px;
			margin-bottom: 20px;
		}
		.btn:hover{
			background-color: blue;
			color: black;
		}
	</style>
</head>

<body>
	<div id="ContactUs">
		<h1 id="header">Contact Us</h1>
		<form action="#">
			<div class="form-shape">
				<label for="query">
					Type of Query
				</label>
				<select name="myQuery" id="query">
					<option value="sel" selected>
						Select
					</option>
					<option value="ord">
						Order related Issues
					</option>
					<option value="Site">
						Site related Issues
					</option>
					<option value="fed">
						Complaint related Issue
					</option>
					<option value="others">
						Others
					</option>
				</select>
			</div>
			<div class="form-shape">
				<label for="name">Name</label>
				<input type="text" name="myName" id="name" placeholder="Enter your Name">
			</div>
			<div class="form-shape">
				<label for="email">Email-Id</label>
				<input type="email" name="Email" id="email" placeholder="Enter your email">
			</div>
			<div class="form-shape">
				<label for="pho">Phone Number</label>
				<input type="phone" name="myPhone" id="pho" placeholder="Enter your Phone no">
			</div>
			<div id="radio">
				Are you a member of OnlineFoodShop: Yes <input type="radio" name="eligible"> No<input type="radio" name="eligible">
			</div>
			<div class="form-shape">
				<label for="message">
					Ellaborate your query
				</label>
				<textarea name="mesg" id="message" cols="30" rows="10">
				</textarea>
			</div>
			<input class="btn" type="submit" value="Submit">
		</form>
	</div>
</body>

</html>
